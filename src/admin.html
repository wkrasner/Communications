<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Communications</title>
<style>
  :root { color-scheme: light dark; --line: #8884; --accent: #2563eb; --soft: #8881; }
  * { box-sizing: border-box; }
  body { font: 15px/1.45 system-ui, sans-serif; margin: 0; padding: 12px;
         max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 18px; margin: 4px 0 10px; }
  nav { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  button { font: inherit; padding: 7px 11px; border: 1px solid var(--line);
           border-radius: 8px; background: none; color: inherit; cursor: pointer; }
  button.on, button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.small { padding: 3px 8px; font-size: 13px; }
  input, textarea { font: inherit; padding: 8px; border: 1px solid var(--line);
                    border-radius: 8px; background: none; color: inherit; width: 100%; }
  .muted { opacity: .65; font-size: 13px; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); }
  .flag { border-color: #d97706; color: #d97706; }
  .contact { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  .chead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
           padding: 9px 11px; background: var(--soft); cursor: pointer; }
  .chead .grow { flex: 1; min-width: 140px; }
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); }
  .pane { background: Canvas; padding: 10px; min-height: 60px; }
  .pane h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
             opacity: .6; margin: 0 0 8px; font-weight: 600; }
  .item { padding: 6px 0; border-bottom: 1px solid var(--soft); }
  .item:last-child { border-bottom: 0; }
  .out { text-align: right; }
  .out .bubble { background: var(--accent); color: #fff; }
  .script { margin-top: 5px; padding: 6px 9px; border-left: 2px solid var(--line);
            font-size: 13.5px; white-space: pre-wrap; opacity: .9; }
  .bubble { display: inline-block; padding: 5px 10px; border-radius: 12px;
            background: var(--soft); max-width: 85%; text-align: left; white-space: pre-wrap; }
  .reply { display: flex; gap: 6px; margin-top: 9px; }
  .reply input { flex: 1; }
  .answered { color: #16a34a; } .blocked, .screen_failed, .ring_failed { color: #dc2626; }
  .missed, .screening { color: #d97706; }
  #msg { min-height: 20px; font-size: 13px; margin-bottom: 8px; }
  .stack > * { margin-bottom: 8px; }
  @media (max-width: 680px) { .panes { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1>Communications</h1>
<div id="login" class="stack" hidden>
  <input id="token" type="password" placeholder="Admin token" autocomplete="current-password">
  <button class="primary" onclick="saveToken()">Sign in</button>
</div>
<div id="app" hidden>
  <nav>
    <button id="tabInbox" onclick="show('inbox')">Inbox</button>
    <button id="tabNums" onclick="show('nums')">Numbers</button>
    <button onclick="refresh()">Refresh</button>
    <button onclick="signOut()" style="margin-left:auto">Sign out</button>
  </nav>
  <input id="search" placeholder="Search calls and texts…" oninput="render()" style="margin-bottom:10px">
  <div id="msg" class="muted"></div>
  <section id="inbox"></section>
  <section id="nums" hidden>
    <div class="stack">
      <textarea id="bulk" rows="5" placeholder="One per line: number, name&#10;609-555-0123, Dr. Smith"></textarea>
      <div style="display:flex; gap:8px">
        <button class="primary" onclick="bulkAdd('allow')">Add as allowed</button>
        <button onclick="bulkAdd('block')">Add as blocked</button>
      </div>
    </div>
    <div id="numList"></div>
  </section>
</div>
<script>
let token = '';
try { token = localStorage.getItem('adminToken') || ''; } catch (e) {}
let calls = [], msgs = [], officeText = '', open = new Set();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const say = t => { $('msg').textContent = t; };
const when = t => new Date(t).toLocaleString([], {month:'numeric', day:'numeric', hour:'numeric', minute:'2-digit'});

async function api(method, path, body) {
  const r = await fetch('/admin/api/' + path, {
    method, headers: {'x-admin-token': token, 'content-type': 'application/json'},
    body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { signOut(); throw new Error('unauthorized'); }
  return r.json();
}
function saveToken() {
  token = $('token').value.trim();
  try { localStorage.setItem('adminToken', token); } catch (e) {}
  start();
}
function signOut() {
  token = '';
  try { localStorage.removeItem('adminToken'); } catch (e) {}
  $('app').hidden = true; $('login').hidden = false;
}
function show(tab) {
  $('inbox').hidden = tab !== 'inbox'; $('nums').hidden = tab !== 'nums';
  $('search').hidden = tab !== 'inbox';
  $('tabInbox').className = tab === 'inbox' ? 'on' : '';
  $('tabNums').className = tab === 'nums' ? 'on' : '';
  tab === 'inbox' ? refresh() : loadNums();
}

async function refresh() {
  say('Loading…');
  const [c, m, o] = await Promise.all([
    api('GET', 'calls'), api('GET', 'messages'), api('GET', 'office-reply')]);
  calls = c; msgs = m; officeText = o.text || '';
  say('');
  render();
}

/** One section per contact, newest activity first. */
function groups() {
  const by = new Map();
  const add = (key, kind, item) => {
    if (!by.has(key)) by.set(key, {key, name: '', calls: [], msgs: [], last: ''});
    const g = by.get(key);
    g[kind].push(item);
    if (item.name && !g.name) g.name = item.name;
    if (item.ts > g.last) g.last = item.ts;
  };
  for (const c of calls) add(c.from, 'calls', c);
  for (const m of msgs) add(m.contact || m.from, 'msgs', m);
  const q = $('search').value.trim().toLowerCase();
  let list = [...by.values()];
  if (q) list = list.filter(g =>
    (g.name + ' ' + g.key).toLowerCase().includes(q) ||
    g.msgs.some(m => (m.text || '').toLowerCase().includes(q)) ||
    g.calls.some(c => ((c.result || '') + ' ' + (c.transcript || '') + ' ' +
                       (c.vm_transcript || '')).toLowerCase().includes(q)));
  for (const g of list) {
    g.calls.sort((a, b) => b.ts.localeCompare(a.ts));
    g.msgs.sort((a, b) => a.ts.localeCompare(b.ts));
  }
  return list.sort((a, b) => b.last.localeCompare(a.last));
}

function render() {
  const list = groups();
  if (!list.length) { $('inbox').innerHTML = '<p class="muted">Nothing yet.</p>'; return; }
  $('inbox').innerHTML = list.map(g => {
    const flagged = g.msgs.some(m => m.medical);
    const isOpen = open.has(g.key) || list.length <= 3;
    return `
    <div class="contact">
      <div class="chead" onclick="toggle('${esc(g.key)}')">
        <div class="grow"><b>${esc(g.name || g.key)}</b>
          ${g.name ? `<span class="muted"> ${esc(g.key)}</span>` : ''}
          ${flagged ? '<span class="tag flag">medical</span>' : ''}
        </div>
        <span class="muted">${g.calls.length} call${g.calls.length === 1 ? '' : 's'} ·
          ${g.msgs.length} text${g.msgs.length === 1 ? '' : 's'} · ${when(g.last)}</span>
        ${g.key.startsWith('+') ? `
          <button class="small" onclick="event.stopPropagation();mark('${esc(g.key)}','allow')">Allow</button>
          <button class="small" onclick="event.stopPropagation();mark('${esc(g.key)}','block')">Block</button>` : ''}
      </div>
      ${isOpen ? `
      <div class="panes">
        <div class="pane">
          <h3>Calls</h3>
          ${g.calls.length ? g.calls.map(c => `
            <div class="item">
              <div><span class="tag">${esc(c.line)}</span>
                <span class="${esc(c.result)}">${esc(String(c.result).replace(/_/g, ' '))}</span>
                ${c.voicemail ? `<button class="small" onclick="play('${esc(c.voicemail)}', this)">Voicemail</button>` : ''}
              </div>
              <div class="muted">${when(c.ts)}</div>
              ${c.recording ? `<button class="small" onclick="play('${esc(c.recording)}', this)">Recording</button>` : ''}
              ${c.transcript ? `<div class="script">${esc(c.transcript)}</div>` : ''}
              ${c.vm_transcript ? `<div class="script"><b>Voicemail:</b> ${esc(c.vm_transcript)}</div>` : ''}
              ${c.error ? `<div class="muted" style="word-break:break-all">${esc(c.error)}</div>` : ''}
            </div>`).join('') : '<p class="muted">No calls.</p>'}
        </div>
        <div class="pane">
          <h3>Texts</h3>
          ${g.msgs.length ? g.msgs.map(m => `
            <div class="item ${m.dir === 'out' ? 'out' : ''}">
              <div class="bubble">${esc(m.text) || '<i>no text</i>'}</div>
              <div class="muted">${esc(m.line)} · ${when(m.ts)}${m.media ? ` · ${m.media} attachment(s)` : ''}</div>
            </div>`).join('') : '<p class="muted">No texts.</p>'}
          ${g.key.startsWith('+') ? `
            <div class="reply">
              <input id="r-${esc(g.key)}" placeholder="Reply…"
                     onkeydown="if(event.key==='Enter')sendText('${esc(g.key)}')">
              <button class="primary small" onclick="sendText('${esc(g.key)}')">Send</button>
            </div>
            ${flagged && officeText ? `
              <button class="small" style="margin-top:6px"
                      onclick="useOffice('${esc(g.key)}')">Use office referral</button>` : ''}
          ` : ''}
        </div>
      </div>` : ''}
    </div>`;
  }).join('');
}

function toggle(key) { open.has(key) ? open.delete(key) : open.add(key); render(); }
function useOffice(key) { $('r-' + key).value = officeText; }

async function sendText(key) {
  const box = $('r-' + key);
  const text = box.value.trim();
  if (!text) return;
  box.disabled = true;
  say('Sending…');
  try {
    const r = await api('POST', 'send', {to: key, text});
    say(r.ok ? r.note : 'Not sent — ' + r.note);
    if (r.ok) { box.value = ''; await refresh(); }
  } catch (e) { say('Not sent — ' + e.message); }
  box.disabled = false;
}
async function play(key, btn) {
  const r = await api('GET', 'voicemail?key=' + encodeURIComponent(key));
  const a = document.createElement('audio');
  a.controls = true; a.src = r.url; a.autoplay = true; a.style.width = '100%';
  btn.replaceWith(a);
}
async function mark(number, status) {
  await api('POST', 'numbers', {numbers: [{number, status}]});
  say(number + ' → ' + status);
  refresh();
}
async function loadNums() {
  say('Loading…');
  const nums = await api('GET', 'numbers');
  say(nums.length + ' numbers');
  $('numList').innerHTML = nums.map(n => `
    <div class="item" style="display:flex;gap:10px;align-items:center">
      <div style="flex:1"><b>${esc(n.name || n.number)}</b>
        <div class="muted">${esc(n.number)} · ${esc(n.status)}</div></div>
      <button class="small" onclick="removeNum('${esc(n.number)}')">Remove</button>
    </div>`).join('');
}
async function bulkAdd(status) {
  const numbers = $('bulk').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const i = l.indexOf(',');
    return i < 0 ? {number: l, status}
                 : {number: l.slice(0, i), name: l.slice(i + 1).trim(), status};
  });
  if (!numbers.length) return;
  const r = await api('POST', 'numbers', {numbers});
  $('bulk').value = (r.skipped || []).join('\n');
  await loadNums();
  say(`Saved ${r.saved}` + (r.skipped.length ? `, ${r.skipped.length} not recognised (left in the box)` : ''));
}
async function removeNum(number) {
  await api('DELETE', 'numbers?number=' + encodeURIComponent(number));
  loadNums();
}
function start() {
  if (!token) { $('login').hidden = false; return; }
  $('login').hidden = true; $('app').hidden = false; show('inbox');
}
start();
</script>
</body>
</html>
