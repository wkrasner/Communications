<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<title>Communications</title>
<style>
  :root {
    color-scheme: light dark;
    --line: #8884; --soft: #8881; --accent: #2563eb; --them: #0f766e;
    --pad: env(safe-area-inset-bottom, 0px);
    --fs: 16px;   /* set by the A-/A+ control, remembered per device */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* An explicit display in a rule below would otherwise beat the UA's
     [hidden] { display: none }, leaving hidden panels on screen. */
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    font: var(--fs)/1.45 system-ui, -apple-system, sans-serif;
    margin: 0; display: flex; flex-direction: column; overflow: hidden;
  }
  button {
    font: inherit; padding: 9px 13px; border: 1px solid var(--line);
    border-radius: 9px; background: none; color: inherit; cursor: pointer;
    min-height: 40px;
  }
  button.on, button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.small { padding: 5px 10px; font-size: .82em; min-height: 32px; }
  /* Keep glyphs from rendering as coloured emoji against a blue button. */
  button { font-variant-emoji: text; }
  button.icon { border: 0; padding: 6px 10px; font-size: 1.25em; min-width: 40px; }
  input, textarea {
    font: inherit; font-size: max(16px, 1em); padding: 10px; border: 1px solid var(--line);
    border-radius: 9px; background: none; color: inherit; width: 100%;
  }
  .muted { opacity: .62; font-size: .82em; }
  .tag { font-size: .7em; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); white-space: nowrap; }
  .flag { border-color: #d97706; color: #d97706; }
  .answered { color: #16a34a; }
  .blocked, .screen_failed, .ring_failed { color: #dc2626; }
  .missed, .screening { color: #d97706; }

  header {
    display: flex; gap: 8px; align-items: center; padding: 10px 12px;
    border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  header h1 { font-size: 1.06em; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { display: flex; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: var(--pad); }
  #msg { font-size: .82em; opacity: .65; }
  #msg:not(:empty) { padding: 6px 12px; }

  .row {
    display: flex; gap: 10px; align-items: center; width: 100%;
    padding: 12px; border-bottom: 1px solid var(--soft); text-align: left;
    border-radius: 0; min-height: 56px;
  }
  .row .grow { flex: 1; min-width: 0; }
  .row .ttl { font-weight: 600; }
  .row .prev { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* A heavy rule so one number's traffic never reads as the next one's. */
  .sep { height: 4px; background: var(--accent); opacity: .85; }
  .pick { width: 22px; height: 22px; flex-shrink: 0; accent-color: var(--accent); }
  .chev { font-size: .82em; opacity: .6; width: 14px; flex-shrink: 0; }

  .thread { padding: 12px; }
  .pane h3 {
    font-size: .7em; text-transform: uppercase; letter-spacing: .06em;
    opacity: .55; margin: 0 0 8px; font-weight: 700;
  }
  .item { padding: 7px 0; border-bottom: 1px solid var(--soft); }
  .item:last-child { border-bottom: 0; }
  .bubble {
    display: inline-block; padding: 7px 11px; border-radius: 14px;
    background: var(--them); color: #fff;
    max-width: 88%; white-space: pre-wrap; word-wrap: break-word;
  }
  .out { text-align: right; }
  .out .bubble { background: var(--accent); color: #fff; text-align: left; }
  .script {
    margin-top: 5px; padding: 6px 9px; border-left: 2px solid var(--line);
    font-size: .88em; white-space: pre-wrap; opacity: .9;
  }
  /* Above the thread, not below it: with newest-first ordering the box
     belongs next to the message you are answering. */
  .composer {
    display: flex; gap: 8px; padding: 10px 12px;
    border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .composer input { flex: 1; }

  /* Wide screens: every contact on one page, calls and texts side by side. */
  @media (min-width: 721px) {
    header, .bar, main, .composer { max-width: 1100px; margin-inline: auto; width: 100%; }
    .contact { border: 1px solid var(--line); border-radius: 11px; margin: 0 12px 14px; overflow: hidden; }
    .contact { border-top: 4px solid var(--accent); }
    .chead { display: flex; gap: 9px; align-items: center; padding: 10px 12px; background: var(--soft); }
    .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); }
    .pane { background: Canvas; padding: 11px; }
    .reply { display: flex; gap: 7px; margin-top: 10px; }
    .reply input { flex: 1; }
  }
</style>
</head>
<body>

<div id="login" hidden style="padding:24px; max-width:380px; margin:40px auto; display:grid; gap:10px">
  <h1 style="font-size:19px;margin:0">Communications</h1>
  <input id="token" type="password" placeholder="Admin token" autocomplete="current-password"
         onkeydown="if(event.key==='Enter')saveToken()">
  <button class="primary" onclick="saveToken()">&#128274; Sign in</button>
</div>

<header id="hdr" hidden>
  <button class="icon" id="back" onclick="closeThread()" hidden>&larr;</button>
  <h1 id="title">Communications</h1>
  <button class="icon" id="newmsg" onclick="newMessage()" title="New message">&#9998;</button>
  <button class="icon" onclick="refresh()" title="Refresh">&#8635;</button>
  <button class="icon" onclick="toggleMenu()" title="Menu">&#8942;</button>
</header>

<div class="bar" id="menu" hidden>
  <button id="tabInbox" onclick="show('inbox')">&#9993; Inbox</button>
  <button id="tabNums" onclick="show('nums')">&#128100; Numbers</button>
  <button id="tabArch" onclick="show('archived')">&#128230; Archived</button>
  <button onclick="showStatus()">&#9881; Status</button>
  <span style="margin-left:auto;display:flex;gap:4px;align-items:center">
    <button class="small" onclick="textSize(-1)" title="Smaller text">A&minus;</button>
    <span id="fsnow" class="muted" style="min-width:34px;text-align:center"></span>
    <button class="small" onclick="textSize(1)" title="Larger text" style="font-size:1.1em">A+</button>
  </span>
  <button onclick="signOut()">&#9094; Sign out</button>
</div>

<div class="bar" id="searchbar" hidden>
  <input id="search" placeholder="Search calls and texts…" oninput="render()">
</div>

<div class="bar" id="selbar" hidden>
  <span id="selcount" class="muted" style="flex:1;align-self:center"></span>
  <button class="small" onclick="batch('archive')">Archive</button>
  <button class="small" onclick="batch('block')">&#8856; Block</button>
  <button class="small" onclick="batch('delete')">&#128465; Delete</button>
  <button class="small" onclick="clearSel()">&#10005; Cancel</button>
</div>

<div id="msg"></div>

<div class="composer" id="composer" hidden>
  <input id="reply" placeholder="Reply…" onkeydown="if(event.key==='Enter')sendText()">
  <button class="primary" onclick="sendText()">&#10148; Send</button>
</div>

<main id="main" hidden></main>

<div id="compose" hidden style="position:fixed;inset:0;background:Canvas;z-index:9;
     display:flex;flex-direction:column">
  <header>
    <button class="icon" onclick="closeCompose()">&larr;</button>
    <h1>New message or call</h1>
  </header>
  <div style="padding:12px;display:grid;gap:10px;overflow-y:auto">
    <input id="newTo" placeholder="Phone number" inputmode="tel" autocomplete="tel">
    <textarea id="newText" rows="4" placeholder="Message"></textarea>
    <div class="muted">Goes out from your cell. Google Voice can only reply inside a
      thread someone else started, so a new conversation can't be sent as 820-5401.</div>
    <div style="display:flex;gap:8px">
      <button class="primary" style="flex:1" onclick="sendNew()">&#10148; Send</button>
      <button style="flex:1" onclick="callNew()">&#9742; Call</button>
    </div>
  </div>
</div>


<script>
let token = '';
try { token = localStorage.getItem('adminToken') || ''; } catch (e) {}

let calls = [], msgs = [], officeText = '';
let tab = 'inbox', openKey = null, expanded = new Set(), shut = new Set();
let picked = new Set();
const narrow = window.matchMedia('(max-width: 720px)');

const FS_MIN = 13, FS_MAX = 26;
let fs = 16;
try { fs = Math.min(FS_MAX, Math.max(FS_MIN, +localStorage.getItem('fontSize') || 16)); } catch (e) {}
function applyTextSize() {
  document.documentElement.style.setProperty('--fs', fs + 'px');
  const el = document.getElementById('fsnow');
  if (el) el.textContent = fs + 'px';
}
function textSize(step) {
  fs = Math.min(FS_MAX, Math.max(FS_MIN, fs + step));
  try { localStorage.setItem('fontSize', fs); } catch (e) {}
  applyTextSize();
}
applyTextSize();

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const say = t => { $('msg').textContent = t || ''; };
const when = t => {
  const d = new Date(t), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  return d.toLocaleString([], sameDay
    ? {hour: 'numeric', minute: '2-digit'}
    : {month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit'});
};

async function api(method, path, body) {
  const r = await fetch('/admin/api/' + path, {
    method, headers: {'x-admin-token': token, 'content-type': 'application/json'},
    body: body ? JSON.stringify(body) : undefined});
  if (r.status === 401) { signOut(); throw new Error('unauthorized'); }
  return r.json();
}
function saveToken() {
  token = $('token').value.trim();
  try { localStorage.setItem('adminToken', token); } catch (e) {}
  start();
}
function signOut() {
  token = '';
  try { localStorage.removeItem('adminToken'); } catch (e) {}
  for (const id of ['hdr', 'menu', 'searchbar', 'main', 'composer', 'compose']) $(id).hidden = true;
  $('login').hidden = false;
}
function toggleMenu() { $('menu').hidden = !$('menu').hidden; }

function show(t) {
  tab = t; openKey = null; picked.clear(); showSel();
  $('menu').hidden = true;
  $('tabInbox').className = t === 'inbox' ? 'on' : '';
  $('tabArch').className = t === 'archived' ? 'on' : '';
  $('tabNums').className = t === 'nums' ? 'on' : '';
  t === 'nums' ? loadNums() : refresh();
}

async function refresh() {
  if (tab === 'nums') return loadNums();
  if (tab === 'status') return;
  say('Loading…');
  try {
    const [c, m, o] = await Promise.all([
      api('GET', 'calls'), api('GET', 'messages'), api('GET', 'office-reply')]);
    calls = c; msgs = m; officeText = o.text || '';
    say('');
  } catch (e) { say('Could not load — ' + e.message); return; }
  render();
}

/** One group per contact, newest activity first. */
function groups() {
  const by = new Map();
  const add = (key, kind, item) => {
    if (!by.has(key)) by.set(key, {key, name: '', calls: [], msgs: [], last: ''});
    const g = by.get(key);
    g[kind].push(item);
    if (item.name && !g.name) g.name = item.name;
    if (item.ts > g.last) g.last = item.ts;
  };
  for (const c of calls) add(c.from, 'calls', c);
  for (const m of msgs) add(m.contact || m.from, 'msgs', m);
  const q = ($('search').value || '').trim().toLowerCase();
  let list = [...by.values()];
  if (q) list = list.filter(g =>
    (g.name + ' ' + g.key).toLowerCase().includes(q) ||
    g.msgs.some(m => (m.text || '').toLowerCase().includes(q)) ||
    g.calls.some(c => ((c.result || '') + ' ' + (c.transcript || '') + ' ' +
                       (c.vm_transcript || '')).toLowerCase().includes(q)));
  const wantArchived = tab === 'archived';
  list = list.filter(g => {
    const all = [...g.calls, ...g.msgs];
    // A thread counts as archived when everything in it is.
    return (all.length > 0 && all.every(i => !!i.archived)) === wantArchived;
  });
  for (const g of list) {
    g.calls.sort((a, b) => b.ts.localeCompare(a.ts));
    g.msgs.sort((a, b) => b.ts.localeCompare(a.ts));
    g.flagged = g.msgs.some(m => m.medical);
  }
  return list.sort((a, b) => b.last.localeCompare(a.last));
}

function callsHtml(g) {
  if (!g.calls.length) return '<p class="muted">No calls.</p>';
  return g.calls.map(c => `
    <div class="item">
      <div><span class="tag">${esc(c.line)}</span>
        <span class="${esc(c.result)}">${esc(String(c.result).replace(/_/g, ' '))}</span>
        ${c.voicemail ? `<button class="small" onclick="play('${esc(c.voicemail)}', this)">&#9654; Voicemail</button>` : ''}
        ${c.recording ? `<button class="small" onclick="play('${esc(c.recording)}', this)">&#9654; Recording</button>` : ''}
      </div>
      <div class="muted">${when(c.ts)}
        <button class="small" style="margin-left:6px"
          onclick="toMedtask('call','${esc(c.pk || c.id || '')}', this)">&#10140; MedTask</button></div>
      ${c.vm_transcript ? `<div class="script">${esc(c.vm_transcript)}</div>` : ''}
      ${c.transcript ? `<div class="script">${esc(c.transcript)}</div>` : ''}
      ${c.error ? `<div class="muted" style="word-break:break-all">${esc(c.error)}</div>` : ''}
    </div>`).join('');
}

function textsHtml(g) {
  if (!g.msgs.length) return '<p class="muted">No texts.</p>';
  return g.msgs.map(m => `
    <div class="item ${m.dir === 'out' ? 'out' : ''}">
      <div class="bubble">${esc(m.text) || '<i>no text</i>'}</div>
      <div class="muted">${esc(m.line)} · ${when(m.ts)}${m.media ? ` · ${m.media} attachment(s)` : ''}
        ${m.dir !== 'out' ? `<button class="small" style="margin-left:6px"
          onclick="toMedtask('text','${esc(m.pk || m.id || '')}', this)">&#10140; MedTask</button>` : ''}</div>
    </div>`).join('');
}

function listRow(g) {
  const lastMsg = g.msgs[0];
  const preview = lastMsg ? (lastMsg.dir === 'out' ? 'You: ' : '') + (lastMsg.text || '')
                          : `${g.calls.length} call${g.calls.length === 1 ? '' : 's'}`;
  return `
    <div class="row">
      <input type="checkbox" class="pick" ${picked.has(g.key) ? 'checked' : ''}
             onchange="pick('${esc(g.key)}', this.checked)">
      <div class="grow" style="cursor:pointer" onclick="openThread('${esc(g.key)}')">
        <div class="ttl">${esc(g.name || g.key)}
          ${g.flagged ? '<span class="tag flag">medical</span>' : ''}</div>
        <div class="prev muted">${esc(preview)}</div>
      </div>
      <div class="muted" style="text-align:right">${when(g.last)}</div>
    </div>`;
}

function render() {
  if (tab !== 'inbox' && tab !== 'archived') return;
  const list = groups();
  const mobile = narrow.matches;

  showSel();
  if (mobile && openKey) {
    const g = list.find(x => x.key === openKey);
    if (!g) { closeThread(); return; }
    $('title').textContent = g.name || g.key;
    $('back').hidden = false;
    $('searchbar').hidden = true;
    $('composer').hidden = !g.key.startsWith('+');
    $('main').innerHTML = `
      <div class="thread">
        <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
          ${g.key.startsWith('+') ? `
            <button class="small" onclick="callOut('${esc(g.key)}')">&#9742; Call</button>
            <button class="small" onclick="mark('${esc(g.key)}','allow')">&#10003; Allow</button>
            <button class="small" onclick="mark('${esc(g.key)}','block')">&#8856; Block</button>` : ''}
          <button class="small" onclick="thread('${esc(g.key)}','${tab === 'archived' ? 'unarchive' : 'archive'}')">${tab === 'archived' ? '&#128229; Unarchive' : '&#128230; Archive'}</button>
          <button class="small" onclick="thread('${esc(g.key)}','delete')">&#128465; Delete</button>
          ${g.key.startsWith('+') && g.flagged && officeText ? `<button class="small" onclick="useOffice()">&#127973; Office referral</button>` : ''}
          <button class="small" onclick="makeTask('${esc(g.key)}')">&#128203; Make task</button>
          <a class="small" style="text-decoration:none;display:inline-flex;align-items:center;
             border:1px solid var(--line);border-radius:9px;padding:5px 10px;color:inherit"
             href="${contactsLink(g)}" target="_blank" rel="noopener">&#128100; Contacts</a>
        </div>
        <div class="pane">
          <h3 onclick="section('texts')" style="cursor:pointer">
            ${shut.has('texts') ? '&#9656;' : '&#9662;'} Texts (${g.msgs.length})</h3>
          ${shut.has('texts') ? '' : textsHtml(g)}
        </div>
        <div class="sep" style="margin:14px -12px"></div>
        <div class="pane">
          <h3 onclick="section('calls')" style="cursor:pointer">
            ${shut.has('calls') ? '&#9656;' : '&#9662;'} Calls (${g.calls.length})</h3>
          ${shut.has('calls') ? '' : callsHtml(g)}
        </div>
      </div>`;
    return;
  }

  $('title').textContent = tab === 'archived' ? 'Archived' : 'Communications';
  $('back').hidden = true;
  $('searchbar').hidden = false;
  $('composer').hidden = true;

  if (!list.length) {
    $('main').innerHTML = '<p class="muted" style="padding:16px">Nothing yet.</p>';
    return;
  }
  if (mobile) { $('main').innerHTML = list.map(listRow).join('<div class="sep"></div>'); return; }

  $('main').innerHTML = list.map(g => {
    const isOpen = expanded.has(g.key);
    return `
    <div class="contact">
      <div class="chead" onclick="toggle('${esc(g.key)}')" style="cursor:pointer">
        <input type="checkbox" class="pick" ${picked.has(g.key) ? 'checked' : ''}
               onclick="event.stopPropagation()"
               onchange="pick('${esc(g.key)}', this.checked)">
        <span class="chev">${isOpen ? '&#9662;' : '&#9656;'}</span>
        <div style="flex:1"><b>${esc(g.name || g.key)}</b>
          ${g.name ? `<span class="muted"> ${esc(g.key)}</span>` : ''}
          ${g.flagged ? '<span class="tag flag">medical</span>' : ''}</div>
        <span class="muted">${g.calls.length} call${g.calls.length === 1 ? '' : 's'} ·
          ${g.msgs.length} text${g.msgs.length === 1 ? '' : 's'} · ${when(g.last)}</span>
        ${g.key.startsWith('+') ? `
          <button class="small" onclick="event.stopPropagation();callOut('${esc(g.key)}')">&#9742; Call</button>
          <button class="small" onclick="event.stopPropagation();mark('${esc(g.key)}','allow')">&#10003; Allow</button>
          <button class="small" onclick="event.stopPropagation();mark('${esc(g.key)}','block')">&#8856; Block</button>` : ''}
        <button class="small" onclick="event.stopPropagation();thread('${esc(g.key)}','${tab === 'archived' ? 'unarchive' : 'archive'}')">${tab === 'archived' ? '&#128229; Unarchive' : '&#128230; Archive'}</button>
        <button class="small" onclick="event.stopPropagation();thread('${esc(g.key)}','delete')">&#128465; Delete</button>
      </div>
      ${isOpen ? `
      <div class="panes">
        <div class="pane"><h3>Calls</h3>${callsHtml(g)}</div>
        <div class="pane"><h3>Texts</h3>
          ${g.key.startsWith('+') ? `
            <div class="reply" style="margin:0 0 10px">
              <input id="r-${esc(g.key)}" placeholder="Reply…"
                     onkeydown="if(event.key==='Enter')sendText('${esc(g.key)}')">
              <button class="primary small" onclick="sendText('${esc(g.key)}')">&#10148; Send</button>
            </div>
            ${g.flagged && officeText ? `<button class="small" style="margin:0 0 10px"
                onclick="useOffice('${esc(g.key)}')">&#127973; Use office referral</button>` : ''}
            <button class="small" style="margin:0 0 10px"
                onclick="makeTask('${esc(g.key)}')">&#128203; Make task</button>
            <a class="small" style="margin:0 0 10px;text-decoration:none;display:inline-flex;
               align-items:center;border:1px solid var(--line);border-radius:9px;
               padding:5px 10px;color:inherit" href="${contactsLink(g)}"
               target="_blank" rel="noopener">&#128100; Contacts</a>` : ''}
          ${textsHtml(g)}
        </div>
      </div>` : ''}
    </div>`;
  }).join('');
}

function newMessage() {
  $('menu').hidden = true;
  $('newTo').value = ''; $('newText').value = '';
  $('compose').hidden = false;
  $('newTo').focus();
}
function closeCompose() { $('compose').hidden = true; }
async function callNew() {
  const to = $('newTo').value.trim();
  if (!to) { say('Need a number.'); return; }
  closeCompose();
  await callOut(to);
}
async function sendNew() {
  const to = $('newTo').value.trim(), text = $('newText').value.trim();
  if (!to || !text) { say('Need a number and a message.'); return; }
  say('Sending…');
  try {
    const r = await api('POST', 'send', {to, text, via: 'cell'});
    if (!r.ok) { say('Not sent — ' + r.note); return; }
    closeCompose();
    say(r.note);
    await refresh();
  } catch (e) { say('Not sent — ' + e.message); }
}

function section(which) { shut.has(which) ? shut.delete(which) : shut.add(which); render(); }
function pick(key, on) {
  on ? picked.add(key) : picked.delete(key);
  showSel();
}
function showSel() {
  $('selbar').hidden = picked.size === 0;
  $('selcount').textContent = picked.size + ' selected';
}
function clearSel() { picked.clear(); showSel(); render(); }

async function batch(action) {
  const contacts = [...picked];
  if (!contacts.length) return;
  const what = contacts.length + (contacts.length === 1 ? ' thread' : ' threads');
  if (action === 'delete' &&
      !confirm(`Delete every call and text in ${what} permanently?`)) return;
  if (action === 'block' &&
      !confirm(`Block ${what}? Those callers will be hung up on.`)) return;
  say('Working…');
  try {
    const r = await api('POST', 'thread', {contacts, action});
    picked.clear();
    showSel();
    await refresh();
    say(r.deleted != null ? `Deleted ${r.deleted} item(s) in ${r.threads} thread(s).`
        : r.blocked != null ? `Blocked ${r.blocked}.`
        : r.archived != null ? `Archived ${r.archived} item(s).`
        : 'Done.');
  } catch (e) { say('Failed — ' + e.message); }
}

function openThread(key) { openKey = key; render(); }
function closeThread() { openKey = null; render(); }
function toggle(key) { expanded.has(key) ? expanded.delete(key) : expanded.add(key); render(); }
function useOffice(key) { (key ? $('r-' + key) : $('reply')).value = officeText; }

async function sendText(key) {
  const target = key || openKey;
  const box = key ? $('r-' + key) : $('reply');
  const text = box.value.trim();
  if (!target || !text) return;
  box.disabled = true;
  say('Sending…');
  try {
    const r = await api('POST', 'send', {to: target, text});
    say(r.ok ? r.note : 'Not sent — ' + r.note);
    if (r.ok) { box.value = ''; await refresh(); }
  } catch (e) { say('Not sent — ' + e.message); }
  box.disabled = false;
}
async function play(key, btn) {
  const r = await api('GET', 'voicemail?key=' + encodeURIComponent(key));
  const a = document.createElement('audio');
  a.controls = true; a.src = r.url; a.autoplay = true; a.style.width = '100%';
  btn.replaceWith(a);
}
async function thread(contact, action) {
  if (action === 'delete' &&
      !confirm('Delete every call and text with ' + contact +
               ' permanently? Voicemail recordings stay in S3.')) return;
  say(action === 'delete' ? 'Deleting…' : 'Working…');
  try {
    const r = await api('POST', 'thread', {contact, action});
    openKey = null;
    await refresh();
    say(r.deleted != null ? `Deleted ${r.deleted} item(s).`
        : r.archived != null ? `Archived ${r.archived} item(s).`
        : `Restored ${r.restored} item(s).`);
  } catch (e) { say('Failed — ' + e.message); }
}

async function mark(number, status) {
  await api('POST', 'numbers', {numbers: [{number, status}]});
  say(number + ' → ' + status);
  refresh();
}
async function showStatus() {
  $('menu').hidden = true;
  tab = 'status'; openKey = null;
  $('searchbar').hidden = true; $('composer').hidden = true; $('back').hidden = true;
  $('title').textContent = 'Status';
  say('Loading…');
  const s = await api('GET', 'status');
  say('');
  const row = (k, v) => `<div class="item"><b>${esc(k)}</b><div class="muted"
      style="word-break:break-all">${esc(v)}</div></div>`;
  const g = s.gmail || {};
  const g2 = s.google_contacts || {};
  $('main').innerHTML = '<div class="thread">' + [
    row('Google Voice poll', g.error ? 'FAILED — ' + g.error
        : g.note ? g.note
        : `ok — ${g.polled} new at ${when(g.ts)} (last message id ${g.uid ?? '—'})`),
    row('Gmail account', s.gmail_user),
    row('Gmail app password', s.gmail_password_len
        ? `${s.gmail_password_len} characters` + (s.gmail_password_len === 16
            ? ' (right length)' : ' — Google app passwords are 16')
        : 'MISSING'),
    row('Cell send key', s.has_sms_api_key ? 'set' : 'missing — replies to cell texts will fail'),
    row('Gateway secret', s.has_gateway_secret ? 'set' : 'MISSING'),
    row('OpenAI key', s.has_openai_key ? 'set' : 'missing — no transcripts'),
`<div class="item"><b>Click to call</b>
       <div class="muted">${s.can_call_out
         ? 'Ready — the Call button rings your handset, then bridges.'
         : 'Unavailable — VOICE_APP_ID is not set.'}</div></div>`,
    `<div class="item"><b>Call recording</b>
       <div class="muted">${s.record_calls
         ? 'on — answered calls are recorded and transcribed'
         : 'off — only voicemail is recorded'}</div>
       <button class="small" style="margin-top:7px"
         onclick="setRecording(${s.record_calls ? 'false' : 'true'})">
         &#9210; Turn ${s.record_calls ? 'off' : 'on'}</button>
       ${s.record_calls ? '' : `<div class="muted" style="margin-top:6px">
         New Jersey is one-party consent; some states a caller may be in are not.</div>`}
     </div>`,
    row('Office number', s.office_phone),
    `<div class="item"><b>Google Contacts</b>
       <div class="muted">${!s.has_google_client
         ? 'No Google client id or secret set — add GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET.'
         : !s.contacts_connected ? 'Not connected.'
         : g2.error ? 'Last sync FAILED — ' + g2.error
         : g2.note ? 'Connected. ' + g2.note
         : `Connected — ${g2.written} name(s) written from ${g2.contacts} number(s)
             (${g2.saved ?? '?'} saved, ${g2.other ?? '?'} auto-collected) at ${when(g2.ts)}`}</div>
       ${s.has_google_client ? `<div style="display:flex;gap:7px;margin-top:7px;flex-wrap:wrap">
         <button class="small" onclick="connectContacts()">&#128279; ${s.contacts_connected ? 'Reconnect' : 'Connect'}</button>
         ${s.contacts_connected ? '<button class="small" onclick="syncContacts()">&#8635; Sync now</button>' : ''}
       </div>` : ''}
     </div>`,
    `<div class="item"><b>Google Voice texts</b>
       <div class="muted">Re-read the mailbox and rewrite every Google Voice
         message from scratch. Use after a parsing fix; nothing is duplicated.</div>
       <button class="small" style="margin-top:7px" onclick="reparse()">&#8635; Re-import</button>
     </div>`,
  ].join('') + '</div>';
  loadTaskLists();
}

async function loadTaskLists() {
  const box = document.getElementById('tasklists');
  if (!box) return;
  try {
    const r = await api('GET', 'task-lists');
    if (r.error) { box.textContent = r.error; return; }
    box.innerHTML = r.lists.map(l => `
      <label style="display:flex;gap:7px;align-items:center;padding:3px 0">
        <input type="radio" name="tl" value="${esc(l.id)}" style="width:auto"
               ${l.id === r.chosen || (!r.chosen && l === r.lists[0]) ? 'checked' : ''}
               onchange="setTaskList('${esc(l.id)}')">
        <span>${esc(l.title)}</span>
      </label>`).join('') || 'No task lists on the account.';
  } catch (e) { box.textContent = 'Could not read task lists — ' + e.message; }
}
async function setTaskList(id) {
  await api('POST', 'settings', {tasklist: id});
  say('Tasks will go to that list.');
}

/** Search Google Contacts for this person; falls back to the number itself. */
function contactsLink(g) {
  const q = encodeURIComponent(g.name || g.key);
  return 'https://contacts.google.com/search/' + q;
}

/** Hand one picked message to MedTask. Only what is pressed is sent. */
async function toMedtask(kind, pk, btn) {
  const id = String(pk).replace(/^(MSG|CALL)#/, '');
  if (!id) { say('That item has no id to send.'); return; }
  const was = btn.textContent;
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const r = await api('POST', 'medtask', {kind, id});
    btn.textContent = r.ok ? (r.dup ? '✓ Already sent' : '✓ Task made') : '✗ Failed';
    say(r.note);
    if (!r.ok) alert('Not sent to MedTask.\n\n' + r.note);
  } catch (e) {
    btn.textContent = '✗ Failed';
    say('Not sent — ' + e.message);
  }
  setTimeout(() => { btn.textContent = was; btn.disabled = false; }, 4000);
}

async function makeTask(key) {
  const g = groups().find(x => x.key === key);
  const latest = g && g.msgs.find(m => m.dir !== 'out');
  say('Creating task…');
  try {
    const r = await api('POST', 'task', {
      contact: key, name: (g && g.name) || '',
      text: latest ? latest.text : ''});
    if (r.ok) {
      say(r.note + ' Open tasks.google.com to see it.');
    } else {
      // A silent failure here is worse than an interruption: the whole point
      // is that something lands on the board.
      say('Not created — ' + (r.note || r.error || 'unknown reason'));
      alert('Task not created.\n\n' + (r.note || r.error || 'unknown reason'));
    }
  } catch (e) {
    say('Not created — ' + e.message);
    alert('Task not created.\n\n' + e.message);
  }
}

async function callOut(to) {
  say('Ringing your phone…');
  try {
    const r = await api('POST', 'call', {to});
    say(r.ok ? r.note : 'Could not call — ' + r.note);
  } catch (e) { say('Could not call — ' + e.message); }
}

async function connectContacts() {
  say('Asking Google…');
  try {
    const r = await api('GET', 'oauth-url');
    if (r.error) { say(r.error); return; }
    say('Approve the access in the window that opened, then come back.');
    window.open(r.url, '_blank', 'noopener');
  } catch (e) { say('Failed — ' + e.message); }
}
async function syncContacts() {
  say('Syncing contacts…');
  try {
    const r = await api('POST', 'contacts-sync');
    say(r.error ? 'Failed — ' + r.error
        : `Wrote ${r.written} name(s) from ${r.contacts} number(s).`);
    await showStatus();
  } catch (e) { say('Failed — ' + e.message); }
}

async function reparse() {
  say('Re-reading the mailbox…');
  try {
    const r = await api('POST', 'poll', {reset: true});
    say(r.error ? 'Failed — ' + r.error : `Re-imported ${r.polled} message(s).`);
  } catch (e) { say('Failed — ' + e.message); }
}

async function setRecording(on) {
  if (on && !confirm('Record both sides of answered calls?\n\n' +
      'New Jersey is one-party consent, but a caller in an all-party state ' +
      '(Pennsylvania among them) may need to be told.')) return;
  say('Saving…');
  try {
    await api('POST', 'settings', {record: on});
    await showStatus();
    say('Call recording ' + (on ? 'on' : 'off') + '.');
  } catch (e) { say('Failed — ' + e.message); }
}

async function loadNums() {
  $('searchbar').hidden = true; $('composer').hidden = true; $('back').hidden = true;
  $('title').textContent = 'Numbers';
  say('Loading…');
  const nums = await api('GET', 'numbers');
  say(nums.length + ' numbers');
  $('main').innerHTML = `
    <div style="padding:12px;display:grid;gap:9px">
      <textarea id="bulk" rows="4" placeholder="One per line: number, name&#10;609-555-0123, Dr. Smith"></textarea>
      <div class="muted">
        <a href="https://contacts.google.com/" target="_blank" rel="noopener"
           style="color:var(--accent)">&#128100; Open Google Contacts</a>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="primary" onclick="bulkAdd('allow')">&#10003; Add as allowed</button>
        <button onclick="bulkAdd('name')">&#127991; Add names only</button>
        <button onclick="bulkAdd('block')">&#8856; Add as blocked</button>
      </div>
      <div style="border-top:1px solid var(--line);padding-top:10px;display:grid;gap:8px">
        <b style="font-size:14px">Import Google Contacts</b>
        <div class="muted">contacts.google.com &rarr; Export &rarr; Google CSV, then pick the file.
          Names label your callers; allowing them also skips the press-1 screen.</div>
        <label style="display:flex;gap:7px;align-items:center">
          <input type="checkbox" id="impAllow" checked style="width:auto">
          <span>Also allow them through</span>
        </label>
        <input type="file" id="csv" accept=".csv,text/csv" onchange="importCsv()">
      </div>
    </div>` + nums.map(n => `
    <div class="row">
      <div class="grow"><div class="ttl">${esc(n.name || n.number)}</div>
        <div class="muted">${esc(n.number)} · ${esc(n.status)}</div></div>
      <button class="small" onclick="removeNum('${esc(n.number)}')">&#128465; Remove</button>
    </div>`).join('');
}
async function bulkAdd(status) {
  const numbers = $('bulk').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const i = l.indexOf(',');
    return i < 0 ? {number: l, status}
                 : {number: l.slice(0, i), name: l.slice(i + 1).trim(), status};
  });
  if (!numbers.length) return;
  const r = await api('POST', 'numbers', {numbers});
  const skipped = r.skipped || [];
  await loadNums();
  $('bulk').value = skipped.join('\n');
  say(`Saved ${r.saved}` + (skipped.length ? `, ${skipped.length} not recognised (left in the box)` : ''));
}
/** Minimal RFC4180 reader: Google's export quotes fields containing commas. */
function parseCsv(text) {
  const rows = [];
  let row = [], field = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') quoted = false;
      else field += c;
    } else if (c === '"') quoted = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else if (c !== '\r') field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim()));
}

async function importCsv() {
  const file = $('csv').files[0];
  if (!file) return;
  say('Reading ' + file.name + '…');
  let rows;
  try { rows = parseCsv(await file.text()); }
  catch (e) { say('Could not read that file — ' + e.message); return; }
  if (rows.length < 2) { say('That file has no contacts in it.'); return; }

  const head = rows[0].map(h => h.trim().toLowerCase());
  const phoneCols = head.map((h, i) => /phone/.test(h) && /value/.test(h) ? i : -1).filter(i => i >= 0);
  const nameCol = head.indexOf('name');
  const firstCol = head.indexOf('first name'), lastCol = head.indexOf('last name');
  const orgCol = head.findIndex(h => /organization.*name/.test(h));
  if (!phoneCols.length) {
    say('No phone columns found — export as "Google CSV" rather than vCard or Outlook.');
    return;
  }

  const status = $('impAllow').checked ? 'allow' : 'name';
  const seen = new Set(), numbers = [];
  for (const r of rows.slice(1)) {
    const name = ((nameCol >= 0 ? r[nameCol] : '') ||
                  [r[firstCol] || '', r[lastCol] || ''].join(' ') ||
                  (orgCol >= 0 ? r[orgCol] : '')).trim();
    for (const c of phoneCols) {
      // One cell can hold several numbers separated by ":::".
      for (const raw of String(r[c] || '').split(/:::|;/)) {
        const digits = raw.replace(/\D/g, '');
        if (digits.length < 10 || seen.has(digits)) continue;
        seen.add(digits);
        numbers.push({number: raw.trim(), name, status});
      }
    }
  }
  if (!numbers.length) { say('No usable phone numbers in that file.'); return; }

  say(`Importing ${numbers.length}…`);
  let saved = 0, skipped = 0;
  for (let i = 0; i < numbers.length; i += 200) {
    const r = await api('POST', 'numbers', {numbers: numbers.slice(i, i + 200)});
    saved += r.saved || 0;
    skipped += (r.skipped || []).length;
    say(`Importing ${Math.min(i + 200, numbers.length)} of ${numbers.length}…`);
  }
  $('csv').value = '';
  await loadNums();
  say(`Imported ${saved} number${saved === 1 ? '' : 's'}` +
      (skipped ? `, ${skipped} not recognised` : '') +
      (status === 'allow' ? ' — they now ring straight through.' : ' — names only, still screened.'));
}

async function removeNum(number) {
  await api('DELETE', 'numbers?number=' + encodeURIComponent(number));
  loadNums();
}

// Follow the screen: rotating a phone, or dragging a desktop window narrow,
// switches between the list-and-thread layout and the side-by-side one.
narrow.addEventListener('change', render);

// Quietly refresh while the page is in the foreground and nothing is half-typed.
setInterval(() => {
  if (document.visibilityState !== 'visible' || tab !== 'inbox') return;
  const el = document.activeElement;
  if (el && el.tagName === 'INPUT' && el.value) return;
  refresh();
}, 30000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && tab === 'inbox') refresh();
});

function start() {
  applyTextSize();
  if (!token) { $('login').hidden = false; return; }
  $('login').hidden = true;
  $('hdr').hidden = false;
  $('main').hidden = false;
  show('inbox');
}
start();
</script>
