<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone screen</title>
<style>
  :root { color-scheme: light dark; --line: #8884; --accent: #2563eb; }
  body { font: 15px/1.4 system-ui, sans-serif; margin: 0; padding: 12px; max-width: 760px; margin-inline: auto; }
  h1 { font-size: 18px; margin: 4px 0 12px; }
  nav { display: flex; gap: 8px; margin-bottom: 12px; }
  button { font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: none; color: inherit; }
  button.on, button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.small { padding: 4px 8px; font-size: 13px; }
  input, textarea, select { font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: none; color: inherit; width: 100%; box-sizing: border-box; }
  .row { border-bottom: 1px solid var(--line); padding: 10px 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 150px; }
  .muted { opacity: .65; font-size: 13px; }
  .tag { font-size: 12px; padding: 2px 7px; border-radius: 99px; border: 1px solid var(--line); }
  .answered { color: #16a34a; } .blocked, .screen_failed { color: #dc2626; } .missed, .screening { color: #d97706; }
  .stack > * { margin-bottom: 8px; }
  #msg { min-height: 20px; font-size: 13px; }
</style>
</head>
<body>
<h1>Phone screen</h1>
<div id="login" class="stack" hidden>
  <input id="token" type="password" placeholder="Admin token" autocomplete="current-password">
  <button class="primary" onclick="saveToken()">Sign in</button>
</div>
<div id="app" hidden>
  <nav>
    <button id="tabCalls" onclick="show('calls')">Calls</button>
    <button id="tabNums" onclick="show('nums')">Numbers</button>
    <button onclick="signOut()" style="margin-left:auto">Sign out</button>
  </nav>
  <div id="msg" class="muted"></div>
  <section id="calls"></section>
  <section id="nums" hidden>
    <div class="stack">
      <textarea id="bulk" rows="5" placeholder="One per line: number, name&#10;609-555-0123, Dr. Smith"></textarea>
      <div style="display:flex; gap:8px">
        <button class="primary" onclick="bulkAdd('allow')">Add as allowed</button>
        <button onclick="bulkAdd('block')">Add as blocked</button>
      </div>
    </div>
    <div id="numList"></div>
  </section>
</div>
<script>
let token = '';
try { token = localStorage.getItem('adminToken') || ''; } catch (e) {}
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const say = t => { $('msg').textContent = t; };

async function api(method, path, body) {
  const r = await fetch('/admin/api/' + path, {
    method, headers: {'x-admin-token': token, 'content-type': 'application/json'},
    body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { signOut(); throw new Error('unauthorized'); }
  return r.json();
}
function saveToken() {
  token = $('token').value.trim();
  try { localStorage.setItem('adminToken', token); } catch (e) {}
  start();
}
function signOut() {
  token = '';
  try { localStorage.removeItem('adminToken'); } catch (e) {}
  $('app').hidden = true; $('login').hidden = false;
}
function show(tab) {
  $('calls').hidden = tab !== 'calls'; $('nums').hidden = tab !== 'nums';
  $('tabCalls').className = tab === 'calls' ? 'on' : ''; $('tabNums').className = tab === 'nums' ? 'on' : '';
  tab === 'calls' ? loadCalls() : loadNums();
}
async function loadCalls() {
  say('Loading…');
  const calls = await api('GET', 'calls');
  say(calls.length ? '' : 'No calls yet.');
  $('calls').innerHTML = calls.map(c => `
    <div class="row">
      <div class="grow">
        <div><b>${esc(c.name || c.from)}</b> <span class="tag">${esc(c.line)}</span></div>
        <div class="muted">${esc(c.name ? c.from + ' · ' : '')}${new Date(c.ts).toLocaleString()} ·
          <span class="${esc(c.result)}">${esc(String(c.result).replace('_', ' '))}</span></div>
      </div>
      ${c.voicemail ? `<button class="small" onclick="play('${esc(c.voicemail)}', this)">Voicemail</button>` : ''}
      ${String(c.from).startsWith('+') && c.list === 'unknown' ? `
        <button class="small" onclick="mark('${esc(c.from)}','allow')">Allow</button>
        <button class="small" onclick="mark('${esc(c.from)}','block')">Block</button>` : ''}
    </div>`).join('');
}
async function play(key, btn) {
  const r = await api('GET', 'voicemail?key=' + encodeURIComponent(key));
  const a = document.createElement('audio');
  a.controls = true; a.src = r.url; a.autoplay = true; a.style.width = '100%';
  btn.replaceWith(a);
}
async function mark(number, status) {
  await api('POST', 'numbers', {numbers: [{number, status}]});
  say(number + ' → ' + status); loadCalls();
}
async function loadNums() {
  say('Loading…');
  const nums = await api('GET', 'numbers');
  say(nums.length + ' numbers');
  $('numList').innerHTML = nums.map(n => `
    <div class="row">
      <div class="grow"><b>${esc(n.name || n.number)}</b>
        <div class="muted">${esc(n.number)} · ${esc(n.status)}</div></div>
      <button class="small" onclick="removeNum('${esc(n.number)}')">Remove</button>
    </div>`).join('');
}
async function bulkAdd(status) {
  const numbers = $('bulk').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const i = l.indexOf(',');
    return i < 0 ? {number: l, status} : {number: l.slice(0, i), name: l.slice(i + 1).trim(), status};
  });
  if (!numbers.length) return;
  const r = await api('POST', 'numbers', {numbers});
  $('bulk').value = (r.skipped || []).join('\n');
  loadNums().then(() => say(`Saved ${r.saved}` + (r.skipped.length ? `, ${r.skipped.length} not recognised (left in the box)` : '')));
}
async function removeNum(number) {
  await api('DELETE', 'numbers?number=' + encodeURIComponent(number));
  loadNums();
}
function start() {
  if (!token) { $('login').hidden = false; return; }
  $('login').hidden = true; $('app').hidden = false; show('calls');
}
start();
</script>
</body>
</html>
