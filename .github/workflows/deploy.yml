name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK: personal-phone

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/setup-sam@v2

      - name: Tests
        run: python -m unittest discover -s tests -v

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: sam build

      - name: Deploy
        env:
          TelnyxApiKey: ${{ secrets.TELNYX_API_KEY }}
          TelnyxPublicKey: ${{ secrets.TELNYX_PUBLIC_KEY }}
          AdminToken: ${{ secrets.ADMIN_TOKEN }}
          RingTarget: ${{ secrets.RING_TARGET }}
          CellDid: ${{ secrets.CELL_DID }}
          GvDid: ${{ secrets.GV_DID }}
          CellNumber: ${{ secrets.CELL_NUMBER }}
          OfficePhone: ${{ secrets.OFFICE_PHONE }}
          GmailUser: ${{ secrets.GMAIL_USER }}
          GmailAppPassword: ${{ secrets.GMAIL_APP_PASSWORD }}
          GatewaySecret: ${{ secrets.GATEWAY_SECRET }}
          SmsGatewayUser: ${{ secrets.SMS_GATEWAY_USER }}
          SmsGatewayPass: ${{ secrets.SMS_GATEWAY_PASS }}
          SmsApiKey: ${{ secrets.SMS_API_KEY }}
          OpenAiApiKey: ${{ secrets.OPENAI_API_KEY }}
          RecordCalls: ${{ vars.RECORD_CALLS }}
        run: |
          # An unset secret becomes an empty string, which SAM rejects outright.
          # Omit those so the template's own default applies.
          params=()
          for key in TelnyxApiKey TelnyxPublicKey AdminToken RingTarget CellDid GvDid \
                     CellNumber OfficePhone GmailUser GmailAppPassword GatewaySecret \
                     SmsGatewayUser SmsGatewayPass SmsApiKey OpenAiApiKey RecordCalls; do
            value="${!key}"
            [ -n "$value" ] && params+=("$key=$value")
          done
          sam deploy \
            --stack-name "$STACK" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${params[@]}"

      - name: Show URLs
        run: |
          aws cloudformation describe-stacks --stack-name "$STACK" \
            --query 'Stacks[0].Outputs' --output table
