name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK: personal-phone

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/setup-sam@v2

      - name: Tests
        run: python -m unittest discover -s tests -v

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: sam build

      - name: Deploy
        run: |
          sam deploy \
            --stack-name "$STACK" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "TelnyxApiKey=${{ secrets.TELNYX_API_KEY }}" \
              "TelnyxPublicKey=${{ secrets.TELNYX_PUBLIC_KEY }}" \
              "AdminToken=${{ secrets.ADMIN_TOKEN }}" \
              "RingTarget=${{ secrets.RING_TARGET }}" \
              "CellDid=${{ secrets.CELL_DID }}" \
              "GvDid=${{ secrets.GV_DID }}"

      - name: Show URLs
        run: |
          aws cloudformation describe-stacks --stack-name "$STACK" \
            --query 'Stacks[0].Outputs' --output table
